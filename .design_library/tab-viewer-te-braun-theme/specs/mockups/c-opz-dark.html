<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>方向 C · OP-Z 暗夜现场</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: #0b0b0d;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Space Grotesk", "PingFang SC", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* ============ 设备机身：深色 ============ */
      .device {
        width: 1360px;
        border-radius: 24px;
        padding: 22px 26px 26px;
        background: linear-gradient(180deg, #2c2c30 0%, #26262a 55%, #212125 100%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.1),
          inset 0 -4px 8px rgba(0, 0, 0, 0.4),
          0 40px 80px rgba(0, 0, 0, 0.7);
        color: #e8e6e1;
      }

      .label {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #7c7a76;
      }

      /* ============ 顶部 ============ */
      .top {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 16px;
        padding: 0 6px;
      }
      .brand .name {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #f2f0ea;
      }
      .brand .en {
        font-size: 10px;
        letter-spacing: 0.32em;
        color: #7c7a76;
        margin-left: 8px;
      }
      .top .spacer {
        flex: 1;
      }
      .navkey {
        border: none;
        cursor: pointer;
        height: 34px;
        padding: 0 18px;
        border-radius: 8px;
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        background: linear-gradient(180deg, #3a3a3f, #2e2e33);
        color: #b9b6b0;
        box-shadow:
          0 3px 0 #17171a,
          0 5px 8px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
      }
      .navkey.active {
        color: #ff7a45;
        box-shadow:
          0 3px 0 #17171a,
          0 5px 8px rgba(0, 0, 0, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          inset 0 0 0 1px rgba(255, 122, 69, 0.45);
      }

      /* ============ 显示条：白字极简 ============ */
      .lcd {
        background: linear-gradient(180deg, #0e0e10, #131316);
        border-radius: 10px;
        box-shadow:
          inset 0 3px 10px rgba(0, 0, 0, 0.9),
          0 1px 0 rgba(255, 255, 255, 0.06);
        padding: 16px 24px;
        display: flex;
        align-items: center;
        gap: 28px;
        margin-bottom: 20px;
        font-family: "IBM Plex Mono", monospace;
      }
      .lcd .bpm {
        color: #f5f3ee;
        font-size: 38px;
        font-weight: 600;
        text-shadow: 0 0 14px rgba(255, 255, 255, 0.25);
      }
      .lcd .bpm small {
        font-size: 15px;
        color: #6a6966;
      }
      .lcd .unit {
        color: #6a6966;
        font-size: 10px;
        letter-spacing: 0.22em;
        margin-top: 22px;
      }
      .lcd .meta {
        color: #8d8b86;
        font-size: 12px;
        letter-spacing: 0.06em;
      }
      .lcd .meta b {
        color: #f5f3ee;
        font-weight: 600;
      }
      .lcd .meta .hot {
        color: #ff7a45;
        text-shadow: 0 0 8px rgba(255, 122, 69, 0.6);
      }
      .lcd .spacer {
        flex: 1;
      }

      /* LED 点阵 */
      .dots {
        display: grid;
        grid-template-columns: repeat(16, 1fr);
        gap: 7px 10px;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #2e2e32;
      }
      .dot.on {
        background: #ff7a45;
        box-shadow: 0 0 7px rgba(255, 122, 69, 0.85);
      }
      .dot.step {
        background: #f5f3ee;
        box-shadow: 0 0 7px rgba(255, 255, 255, 0.6);
      }

      /* ============ 主区 ============ */
      .main {
        display: flex;
        gap: 22px;
      }

      /* ---- 乐谱：白纸 + 深色边框框住 ---- */
      .score-frame {
        flex: 1;
        background: linear-gradient(180deg, #1a1a1d, #151517);
        border-radius: 12px;
        padding: 10px;
        box-shadow:
          inset 0 2px 8px rgba(0, 0, 0, 0.7),
          0 1px 0 rgba(255, 255, 255, 0.05);
      }
      .score {
        height: 100%;
        background: #fdfcf9;
        border-radius: 7px;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        padding: 26px 34px;
        position: relative;
        overflow: hidden;
        color: #232323;
      }
      .score h1 {
        font-size: 22px;
        font-weight: 700;
      }
      .score .sub {
        font-size: 12px;
        color: #8d8880;
        margin: 4px 0 20px;
        font-family: "IBM Plex Mono", monospace;
      }
      .system {
        position: relative;
        height: 132px;
        margin-bottom: 34px;
      }
      .staff {
        position: absolute;
        left: 0;
        right: 0;
        height: 1px;
        background: #3a3835;
      }
      .clef {
        position: absolute;
        left: 0;
        font-family: "IBM Plex Mono", monospace;
        font-size: 10px;
        font-weight: 600;
        color: #3a3835;
      }
      .note {
        position: absolute;
        transform: translate(-50%, -50%);
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        font-weight: 600;
        color: #1f1e1c;
        background: #fdfcf9;
        padding: 0 2px;
      }
      .loop-region {
        position: absolute;
        top: -10px;
        bottom: -10px;
        background: rgba(255, 122, 69, 0.1);
        border-left: 2px solid #ff7a45;
        border-right: 2px solid #ff7a45;
      }
      .loop-tag {
        position: absolute;
        top: -26px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 10px;
        font-weight: 600;
        color: #ff7a45;
      }
      .playhead {
        position: absolute;
        top: -12px;
        bottom: -12px;
        width: 2px;
        background: #ff5c38;
        box-shadow: 0 0 6px rgba(255, 92, 56, 0.5);
      }
      .playhead::before {
        content: "";
        position: absolute;
        top: -6px;
        left: -4px;
        border: 5px solid transparent;
        border-top-color: #ff5c38;
      }

      /* ---- 右侧控制仓 ---- */
      .deck {
        width: 420px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .row {
        display: flex;
        gap: 14px;
        align-items: flex-end;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
      }
      .grow {
        flex: 1;
      }

      /* 旋钮 */
      .knob-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .knob {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        position: relative;
        box-shadow:
          0 6px 12px rgba(0, 0, 0, 0.55),
          inset 0 2px 3px rgba(255, 255, 255, 0.14),
          inset 0 -3px 6px rgba(0, 0, 0, 0.5);
      }
      .knob-dark {
        background: radial-gradient(circle at 35% 30%, #45454b, #1b1b1f 70%);
      }
      .knob-orange {
        background: radial-gradient(circle at 35% 30%, #ff8f52, #e8541c 70%);
      }
      .knob::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 5px;
        width: 3px;
        height: 15px;
        border-radius: 2px;
        transform: translateX(-50%) rotate(38deg);
        transform-origin: 1.5px 24px;
      }
      .knob-dark::after {
        background: #ff7a45;
        box-shadow: 0 0 5px rgba(255, 122, 69, 0.8);
      }
      .knob-orange::after {
        background: #fff;
      }

      /* 按键 */
      .key {
        border: none;
        cursor: pointer;
        border-radius: 8px;
        font-family: "Space Grotesk", "PingFang SC", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          transform 0.05s,
          box-shadow 0.05s;
        user-select: none;
      }
      .key-dark {
        background: linear-gradient(180deg, #3c3c41, #2a2a2e);
        color: #d9d6d0;
        box-shadow:
          0 5px 0 #131316,
          0 9px 12px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.09);
      }
      .key-dark:active {
        transform: translateY(4px);
        box-shadow:
          0 1px 0 #131316,
          0 3px 4px rgba(0, 0, 0, 0.45);
      }
      .key-orange {
        background: linear-gradient(180deg, #ff7038, #ef521b);
        color: #fff;
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.3);
        box-shadow:
          0 5px 0 #a03810,
          0 9px 14px rgba(239, 82, 27, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }
      .key-orange:active {
        transform: translateY(4px);
        box-shadow:
          0 1px 0 #a03810,
          0 3px 5px rgba(239, 82, 27, 0.35);
      }
      .key-red {
        background: linear-gradient(180deg, #e0392a, #c22a1e);
        color: #fff;
        box-shadow:
          0 5px 0 #8c1c13,
          0 9px 12px rgba(194, 42, 30, 0.4),
          inset 0 1px 0 rgba(255, 255, 255, 0.25);
      }
      .k-lg {
        height: 64px;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.1em;
      }
      .k-md {
        height: 52px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.06em;
      }
      .k-sm {
        height: 44px;
        font-size: 12px;
        font-weight: 500;
      }
      .k-pad {
        width: 88px;
        height: 62px;
        font-size: 20px;
        font-weight: 700;
        font-family: "IBM Plex Mono", monospace;
        flex-direction: column;
        gap: 2px;
      }
      .k-pad small {
        font-size: 9px;
        font-weight: 400;
        font-family: "Space Grotesk", sans-serif;
        opacity: 0.55;
        letter-spacing: 0.1em;
      }
      .k-pad.selected {
        color: #ff7a45;
        box-shadow:
          0 5px 0 #131316,
          0 9px 12px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.09),
          inset 0 0 0 1px rgba(255, 122, 69, 0.5);
      }

      .divider {
        border: none;
        border-top: 1px solid rgba(0, 0, 0, 0.5);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05);
        margin: 2px 0;
      }
      .led {
        width: 7px;
        height: 7px;
        border-radius: 50%;
      }
      .led-on {
        background: #ff7a45;
        box-shadow: 0 0 7px rgba(255, 122, 69, 0.9);
      }
      .led-green {
        background: #6fdc73;
        box-shadow: 0 0 7px rgba(111, 220, 115, 0.9);
      }
      .led-off {
        background: #3a3a3e;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="device">
      <!-- 顶部 -->
      <div class="top">
        <div class="brand">
          <span class="name">逐拍<span class="en">ZUPULSE</span></span>
        </div>
        <div class="spacer"></div>
        <button class="navkey">曲谱库</button>
        <button class="navkey active">练习</button>
        <button class="navkey">工作室</button>
      </div>

      <!-- 显示条 -->
      <div class="lcd">
        <div class="bpm">120<small>.0</small></div>
        <div class="unit">BPM</div>
        <div class="meta">小节 <b>12 / 48</b> · 循环 <span class="hot">A–B</span> · 轨道 <b>主音吉他</b></div>
        <div class="spacer"></div>
        <div class="dots">
          <div class="dot on"></div>
          <div class="dot on"></div>
          <div class="dot on"></div>
          <div class="dot step"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>

      <!-- 主区 -->
      <div class="main">
        <!-- 乐谱 -->
        <div class="score-frame">
          <div class="score">
            <h1>晴天 · 主音吉他谱</h1>
            <div class="sub">Standard Tuning · Capo 2 · 4/4</div>

            <div class="system">
              <div class="loop-region" style="left: 34%; width: 30%"></div>
              <div class="loop-tag" style="left: 34%">A</div>
              <div class="loop-tag" style="left: 62%">B</div>
              <div class="playhead" style="left: 47%"></div>
              <div class="staff" style="top: 12px"></div>
              <div class="staff" style="top: 32px"></div>
              <div class="staff" style="top: 52px"></div>
              <div class="staff" style="top: 72px"></div>
              <div class="staff" style="top: 92px"></div>
              <div class="staff" style="top: 112px"></div>
              <div class="clef" style="top: 8px">e</div>
              <div class="clef" style="top: 28px">B</div>
              <div class="clef" style="top: 48px">G</div>
              <div class="clef" style="top: 68px">D</div>
              <div class="clef" style="top: 88px">A</div>
              <div class="clef" style="top: 108px">E</div>
              <div class="note" style="left: 12%; top: 52px">0</div>
              <div class="note" style="left: 17%; top: 32px">2</div>
              <div class="note" style="left: 22%; top: 12px">0</div>
              <div class="note" style="left: 27%; top: 32px">2</div>
              <div class="note" style="left: 37%; top: 52px">2</div>
              <div class="note" style="left: 41%; top: 32px">4</div>
              <div class="note" style="left: 45%; top: 12px">2</div>
              <div class="note" style="left: 52%; top: 52px">2</div>
              <div class="note" style="left: 56%; top: 32px">4</div>
              <div class="note" style="left: 60%; top: 12px">4</div>
              <div class="note" style="left: 68%; top: 72px">4</div>
              <div class="note" style="left: 72%; top: 52px">2</div>
              <div class="note" style="left: 76%; top: 32px">2</div>
              <div class="note" style="left: 84%; top: 92px">2</div>
              <div class="note" style="left: 88%; top: 72px">2</div>
            </div>

            <div class="system">
              <div class="staff" style="top: 12px"></div>
              <div class="staff" style="top: 32px"></div>
              <div class="staff" style="top: 52px"></div>
              <div class="staff" style="top: 72px"></div>
              <div class="staff" style="top: 92px"></div>
              <div class="staff" style="top: 112px"></div>
              <div class="note" style="left: 12%; top: 112px">3</div>
              <div class="note" style="left: 17%; top: 92px">2</div>
              <div class="note" style="left: 22%; top: 72px">0</div>
              <div class="note" style="left: 27%; top: 52px">2</div>
              <div class="note" style="left: 36%; top: 112px">2</div>
              <div class="note" style="left: 41%; top: 92px">0</div>
              <div class="note" style="left: 46%; top: 72px">2</div>
              <div class="note" style="left: 55%; top: 52px">0</div>
              <div class="note" style="left: 60%; top: 32px">0</div>
              <div class="note" style="left: 65%; top: 12px">0</div>
            </div>
          </div>
        </div>

        <!-- 控制仓 -->
        <div class="deck">
          <!-- 旋钮排 -->
          <div class="row" style="justify-content: space-between; padding: 0 8px">
            <div class="knob-wrap">
              <div class="knob knob-orange"></div>
              <span class="label">音量</span>
            </div>
            <div class="knob-wrap">
              <div class="knob knob-dark"></div>
              <span class="label">速度</span>
            </div>
            <div class="knob-wrap">
              <div class="knob knob-dark"></div>
              <span class="label">音调</span>
            </div>
            <div class="knob-wrap">
              <div class="knob knob-dark"></div>
              <span class="label">声像</span>
            </div>
          </div>

          <hr class="divider" />

          <!-- 主操作 -->
          <div class="row">
            <div class="col grow">
              <span class="label">播放 / 暂停</span>
              <button class="key key-orange k-lg" style="width: 100%">▶ 播放</button>
            </div>
            <div class="col">
              <span class="label">停止</span>
              <button class="key key-dark k-md" style="width: 88px">■</button>
            </div>
            <div class="col">
              <span class="label">循环</span>
              <div class="led led-on"></div>
              <button class="key key-red k-md" style="width: 88px">A–B</button>
            </div>
          </div>

          <hr class="divider" />

          <!-- 轨道 pads -->
          <div class="col" style="align-items: stretch">
            <span class="label">轨道选择</span>
            <div class="row">
              <button class="key key-dark k-pad selected">A<small>主音</small></button>
              <button class="key key-dark k-pad">B<small>节奏</small></button>
              <button class="key key-dark k-pad">C<small>贝斯</small></button>
              <button class="key key-dark k-pad">D<small>鼓</small></button>
            </div>
            <div class="row" style="justify-content: space-around; padding: 0 30px">
              <div class="led led-green"></div>
              <div class="led led-off"></div>
              <div class="led led-off"></div>
              <div class="led led-off"></div>
            </div>
          </div>

          <hr class="divider" />

          <!-- 功能键 -->
          <div class="row">
            <button class="key key-dark k-sm grow">练习设置</button>
            <button class="key key-dark k-sm grow">谱面缩放</button>
            <button class="key key-dark k-sm" style="width: 88px">速度 ±</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
