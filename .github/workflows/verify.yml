name: Verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tools/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node-22-pnpm-9.3.0-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Report Feature Contract impact
        if: github.event_name == 'pull_request'
        run: pnpm docs:impact --base "${{ github.event.pull_request.base.sha }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: pnpm verify

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tools/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node-22-pnpm-9.3.0-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm --filter @zupulse/web-demo exec playwright install --with-deps --only-shell chromium
      - run: pnpm demo:test:e2e
      - run: pnpm demo:test:telemetry:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-results
          path: |
            apps/web-demo/test-results
            apps/web-demo/playwright-report
          if-no-files-found: ignore

  desktop-e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            tools/*/node_modules
          key: node-modules-${{ runner.os }}-${{ runner.arch }}-node-22-pnpm-9.3.0-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - run: pnpm desktop:build
      - run: pnpm desktop:test:e2e
      - run: pnpm desktop:test:telemetry:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-results
          path: |
            apps/desktop-shell/test-results
            apps/desktop-shell/playwright-report
          if-no-files-found: ignore
