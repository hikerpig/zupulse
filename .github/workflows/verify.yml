name: Verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Report Feature Contract impact
        if: github.event_name == 'pull_request'
        run: pnpm docs:impact --base "${{ github.event.pull_request.base.sha }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: pnpm verify
      - run: pnpm --filter @zupulse/web-demo exec playwright install --with-deps chromium
      - run: pnpm demo:test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-results
          path: |
            apps/web-demo/test-results
            apps/web-demo/playwright-report
          if-no-files-found: ignore

  desktop-e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:build
      - run: pnpm desktop:test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-results
          path: |
            apps/desktop-shell/test-results
            apps/desktop-shell/playwright-report
          if-no-files-found: ignore
